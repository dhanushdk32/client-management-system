<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cmsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <filter id="cmsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base with Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#cmsGrad)" filter="url(#cmsGlow)" />
  <rect x="36" y="36" width="440" height="440" rx="108" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4" />

  <!-- Connection Links -->
  <line x1="256" y1="140" x2="256" y2="245" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.9" />
  <line x1="140" y1="300" x2="256" y2="245" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.9" />
  <line x1="372" y1="300" x2="256" y2="245" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.9" />
  <line x1="140" y1="300" x2="372" y2="300" stroke="#ffffff" stroke-width="8" stroke-dasharray="12 8" opacity="0.5" />

  <!-- Center Hub (Management Core) -->
  <circle cx="256" cy="245" r="48" fill="#ffffff" />
  <circle cx="256" cy="245" r="34" fill="#0284c7" />
  <circle cx="256" cy="245" r="14" fill="#ffffff" />

  <!-- Outer Orbit Nodes (Clients / Team) -->
  <!-- Top Node -->
  <circle cx="256" cy="140" r="32" fill="#ffffff" />
  <circle cx="256" cy="140" r="22" fill="#38bdf8" />
  <!-- Left Node -->
  <circle cx="140" cy="300" r="32" fill="#ffffff" />
  <circle cx="140" cy="300" r="22" fill="#38bdf8" />
  <!-- Right Node -->
  <circle cx="372" cy="300" r="32" fill="#ffffff" />
  <circle cx="372" cy="300" r="22" fill="#38bdf8" />

  <!-- Bottom Accent Tag -->
  <path d="M 210 385 Q 256 395 302 385" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8" fill="none" />
</svg>
